<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Signal — editorial data content slide template</title>
  <desc id="desc">An ivory editorial slide presenting a headline, an animated quarterly bar chart, and a highlighted metric.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff6548"/><stop offset="1" stop-color="#fa9d55"/>
    </linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#28231f" opacity=".07"/><circle cx="19" cy="17" r=".8" fill="#28231f" opacity=".055"/>
    </pattern>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .tag { fill: #665e56; font-size: 16px; font-weight: 700; letter-spacing: 4px; }
      .heading { fill: #1d1a18; font-size: 67px; font-weight: 760; letter-spacing: -4px; }
      .copy { fill: #665e56; font-size: 21px; }
      .enter { opacity: 0; transform: translateY(15px); animation: enter .85s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .16s; }.d2 { animation-delay: .3s; }
      .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1s cubic-bezier(.2,.8,.2,1) forwards; }
      .b2 { animation-delay: .12s; }.b3 { animation-delay: .24s; }.b4 { animation-delay: .36s; }
      .metric { animation: pulse 3s ease-in-out infinite; transform-origin: 1523px 350px; }
      @keyframes enter { to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { to { transform: scaleY(1); } }
      @keyframes pulse { 50% { transform: scale(1.035); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        .enter { opacity: 1; transform: none; }.bar { transform: scaleY(1); }
      }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f5f0e8"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <text class="tag enter" x="144" y="116">02  /  THE MOMENTUM</text>
  <text class="heading enter d1" x="140" y="226">Progress you can</text>
  <text class="heading enter d1" x="140" y="302">actually measure.</text>
  <text class="copy enter d2" x="146" y="359">Replace this line with the context behind your numbers.</text>
  <g class="metric">
    <circle cx="1523" cy="349" r="105" fill="url(#ink)"/>
    <text x="1523" y="344" text-anchor="middle" fill="#fff9f2" font-size="49" font-weight="760" letter-spacing="-3">+38%</text>
    <text x="1523" y="379" text-anchor="middle" fill="#fff9f2" font-size="14" font-weight="700" letter-spacing="2">THIS YEAR</text>
  </g>
  <text class="tag" x="146" y="498" font-size="13" letter-spacing="3">RESULTS BY QUARTER</text>
  <path d="M145 840H1384M145 567H1384M145 635H1384M145 703H1384M145 771H1384" stroke="#29231e" stroke-opacity=".12"/>
  <text x="112" y="845" text-anchor="end" fill="#81766d" font-size="14">0</text>
  <text x="112" y="776" text-anchor="end" fill="#81766d" font-size="14">25</text>
  <text x="112" y="708" text-anchor="end" fill="#81766d" font-size="14">50</text>
  <text x="112" y="640" text-anchor="end" fill="#81766d" font-size="14">75</text>
  <text x="112" y="572" text-anchor="end" fill="#81766d" font-size="14">100</text>
  <rect class="bar" x="272" y="730" width="116" height="110" rx="12" fill="#f4bb89"/>
  <rect class="bar b2" x="516" y="686" width="116" height="154" rx="12" fill="#f2a178"/>
  <rect class="bar b3" x="760" y="628" width="116" height="212" rx="12" fill="#ef8968"/>
  <rect class="bar b4" x="1004" y="558" width="116" height="282" rx="12" fill="url(#ink)"/>
  <text x="330" y="876" text-anchor="middle" fill="#665e56" font-size="16">Q1</text>
  <text x="574" y="876" text-anchor="middle" fill="#665e56" font-size="16">Q2</text>
  <text x="818" y="876" text-anchor="middle" fill="#665e56" font-size="16">Q3</text>
  <text x="1062" y="876" text-anchor="middle" fill="#665e56" font-size="16">Q4</text>
  <g transform="translate(1460 570)">
    <rect width="300" height="270" rx="16" fill="#fffaf2" stroke="#28231f" stroke-opacity=".1"/>
    <text class="tag" x="28" y="48" font-size="13" letter-spacing="2">WHAT CHANGED</text>
    <circle cx="36" cy="91" r="5" fill="#f07858"/>
    <text x="54" y="97" fill="#27211e" font-size="18" font-weight="650">More returning</text>
    <text x="54" y="123" fill="#27211e" font-size="18" font-weight="650">customers</text>
    <circle cx="36" cy="167" r="5" fill="#f2a178"/>
    <text x="54" y="173" fill="#27211e" font-size="18" font-weight="650">Faster time to</text>
    <text x="54" y="199" fill="#27211e" font-size="18" font-weight="650">first value</text>
    <text x="28" y="239" fill="#81766d" font-size="14">Replace with your key drivers</text>
  </g>
  <path d="M144 933H1776" stroke="#25211d" stroke-opacity=".16"/>
  <text class="tag" x="144" y="984" font-size="13" letter-spacing="3">YOUR BRAND</text>
  <text x="1776" y="984" text-anchor="end" fill="#665e56" font-size="14" letter-spacing="3">02  /  08</text>
</svg>
