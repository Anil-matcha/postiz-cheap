<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Signal — editorial data story template</title>
  <desc id="desc">A warm ivory editorial slide with oversized black typography, animated data bars, and a vivid coral accent.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff6548"/><stop offset="1" stop-color="#fa9d55"/>
    </linearGradient>
    <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#28231f" opacity=".07"/>
      <circle cx="19" cy="17" r=".8" fill="#28231f" opacity=".055"/>
    </pattern>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .tag { fill: #665e56; font-size: 19px; font-weight: 700; letter-spacing: 5px; }
      .headline { fill: #1d1a18; font-size: 102px; font-weight: 760; letter-spacing: -6px; }
      .caption { fill: #665e56; font-size: 24px; }
      .enter { opacity: 0; transform: translateY(18px); animation: enter .9s cubic-bezier(.2,.7,.2,1) forwards; }
      .late { animation-delay: .2s; }
      .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: grow 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
      .b2 { animation-delay: .12s; }.b3 { animation-delay: .24s; }.b4 { animation-delay: .36s; }
      .dot { animation: pulse 2.6s ease-in-out infinite; transform-origin: 1518px 375px; }
      @keyframes enter { to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { to { transform: scaleY(1); } }
      @keyframes pulse { 50% { transform: scale(1.12); opacity: .72; } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        .enter { opacity: 1; transform: none; }
        .bar { transform: scaleY(1); }
      }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f5f0e8"/>
  <rect width="1920" height="1080" fill="url(#grain)"/>
  <path d="M0 816H1920" stroke="#24201d" stroke-opacity=".13"/>
  <g class="enter">
    <text class="tag" x="142" y="156">FIELD NOTES  /  01</text>
    <circle class="dot" cx="1518" cy="375" r="116" fill="url(#ink)"/>
    <text x="1518" y="362" text-anchor="middle" fill="#fff9f2" font-size="54" font-weight="760" letter-spacing="-3">+38%</text>
    <text x="1518" y="401" text-anchor="middle" fill="#fff9f2" font-size="16" font-weight="650" letter-spacing="3">YEAR OVER YEAR</text>
  </g>
  <g class="enter late">
    <text class="headline" x="140" y="370">The signal</text>
    <text class="headline" x="140" y="486">is already</text>
    <text class="headline" x="140" y="602" fill="#ef654a">there.</text>
    <text class="caption" x="146" y="681">A sharper story starts with what the numbers</text>
    <text class="caption" x="146" y="718">are really telling you.</text>
  </g>
  <g transform="translate(0 0)">
    <text class="tag" x="144" y="884" font-size="14" letter-spacing="3">GROWTH OVER TIME</text>
    <path d="M145 965H1775" stroke="#25211d" stroke-opacity=".2"/>
    <rect class="bar" x="810" y="907" width="70" height="58" rx="8" fill="#f3ac72"/>
    <rect class="bar b2" x="916" y="870" width="70" height="95" rx="8" fill="#f18c62"/>
    <rect class="bar b3" x="1022" y="826" width="70" height="139" rx="8" fill="#f17a59"/>
    <rect class="bar b4" x="1128" y="766" width="70" height="199" rx="8" fill="url(#ink)"/>
    <text x="812" y="997" fill="#7b7168" font-size="17">Q1</text>
    <text x="918" y="997" fill="#7b7168" font-size="17">Q2</text>
    <text x="1024" y="997" fill="#7b7168" font-size="17">Q3</text>
    <text x="1130" y="997" fill="#7b7168" font-size="17">Q4</text>
  </g>
  <text x="1776" y="1000" text-anchor="end" fill="#665e56" font-size="17" letter-spacing="2">YOUR STORY, IN NUMBERS</text>
</svg>
