<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Orbit — cinematic product reveal template</title>
  <desc id="desc">A cinematic midnight-blue title slide with glowing orbital rings, a radiant star, and editable presentation text.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08091b"/>
      <stop offset="1" stop-color="#17133b"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6a3ff"/>
      <stop offset=".52" stop-color="#7867ff"/>
      <stop offset="1" stop-color="#55e3e8"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#7466ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7466ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#b4b5ff" stroke-opacity=".055"/>
    </pattern>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .eyebrow { fill: #aaa5e8; font-size: 21px; font-weight: 650; letter-spacing: 7px; }
      .title { fill: #f7f5ff; font-size: 112px; font-weight: 750; letter-spacing: -7px; }
      .subtitle { fill: #bdbbd9; font-size: 28px; font-weight: 400; letter-spacing: 1px; }
      .fade { opacity: 0; transform: translateY(20px); animation: rise 1s cubic-bezier(.2,.7,.2,1) forwards; }
      .delay { animation-delay: .25s; }
      .orbit-a { transform-origin: 1380px 540px; animation: revolve 32s linear infinite; }
      .orbit-b { transform-origin: 1380px 540px; animation: revolve 42s linear infinite reverse; }
      .star { transform-origin: 1380px 540px; animation: breathe 5s ease-in-out infinite; }
      @keyframes rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes revolve { to { transform: rotate(360deg); } }
      @keyframes breathe { 50% { transform: scale(1.06); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        .fade { opacity: 1; transform: none; }
      }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1380" cy="540" rx="510" ry="490" fill="url(#aura)"/>
  <g fill="#e3e1ff">
    <circle cx="106" cy="142" r="2" opacity=".65"/><circle cx="742" cy="181" r="2" opacity=".5"/>
    <circle cx="852" cy="892" r="2" opacity=".58"/><circle cx="1654" cy="228" r="2" opacity=".7"/>
    <circle cx="1773" cy="858" r="2" opacity=".48"/><circle cx="1005" cy="534" r="1.5" opacity=".5"/>
  </g>
  <g fill="none" stroke="url(#orbit)" filter="url(#glow)">
    <ellipse class="orbit-a" cx="1380" cy="540" rx="315" ry="126" stroke-width="3" opacity=".85"/>
    <ellipse class="orbit-b" cx="1380" cy="540" rx="315" ry="126" stroke-width="2" opacity=".63" transform="rotate(65 1380 540)"/>
    <ellipse cx="1380" cy="540" rx="315" ry="126" stroke-width="2" opacity=".43" transform="rotate(-58 1380 540)"/>
  </g>
  <g class="star" filter="url(#glow)">
    <path d="M1380 317 1432 488 1603 540 1432 592 1380 763 1328 592 1157 540 1328 488Z" fill="#8978ff" fill-opacity=".33" stroke="url(#orbit)" stroke-width="3"/>
    <path d="M1380 390 1414 506 1530 540 1414 574 1380 690 1346 574 1230 540 1346 506Z" fill="#a99dff" fill-opacity=".42" stroke="#d1c9ff" stroke-opacity=".8" stroke-width="2"/>
    <circle cx="1380" cy="540" r="24" fill="#f3f0ff"/>
  </g>
  <g transform="translate(1760 540)" fill="#65e5ec" filter="url(#glow)">
    <circle r="6"/><circle cx="-28" cy="-10" r="3" opacity=".7"/>
  </g>
  <g transform="translate(0 0)">
    <text class="eyebrow fade" x="160" y="252">YOUR BRAND · PRESENTS</text>
    <text class="title fade delay" x="150" y="454">Beyond</text>
    <text class="title fade delay" x="150" y="576">the obvious.</text>
    <rect x="162" y="624" width="142" height="4" rx="2" fill="url(#orbit)"/>
    <text class="subtitle fade delay" x="160" y="700">A new perspective begins here.</text>
    <text class="eyebrow fade delay" x="160" y="858" font-size="15" letter-spacing="4">PRODUCT REVEAL  /  2026</text>
  </g>
  <rect x="36" y="36" width="1848" height="1008" rx="22" fill="none" stroke="#c2bfff" stroke-opacity=".15" stroke-width="2"/>
</svg>
