<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Pulse — content slide template</title>
  <desc id="desc">A reusable Pulse content slide with metric cards and narrative blocks.</desc>
  <defs>
    <linearGradient id="bgc-pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#240b10"/>
      <stop offset="0.55" stop-color="#430d1d"/>
      <stop offset="1" stop-color="#1b0d2c"/>
    </linearGradient>
    <linearGradient id="card-pulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.04)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .eyebrow { fill: #fdecc2; font-size: 18px; letter-spacing: 5px; font-weight: 700; }
      .title { fill: #f7fbff; font-size: 70px; font-weight: 800; letter-spacing: -3px; }
      .small { fill: #fdecc2; font-size: 22px; font-weight: 500; }
      .metric { fill: #ffffff; font-size: 48px; font-weight: 800; letter-spacing: -2px; }
      .label { fill: #fdecc2; font-size: 16px; letter-spacing: 2px; }
      .body { fill: rgba(255,255,255,0.8); font-size: 28px; font-weight: 500; }
      .reveal { opacity: 0; transform: translateY(22px); animation: reveal .9s ease forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
      .float { animation: float 7s ease-in-out infinite; }
      @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 50% { transform: translateY(-12px); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        .reveal { opacity: 1; transform: none; }
      }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgc-pulse)"/>
  <circle cx="1468" cy="210" r="430" fill="#ff8a5c" opacity="0.12"/>
  <circle cx="1645" cy="900" r="260" fill="#ff4573" opacity="0.10"/>
  <rect x="90" y="90" width="1740" height="900" rx="30" fill="none" stroke="rgba(255,255,255,0.14)"/>

  <g class="reveal d1">
    <text x="130" y="176" class="eyebrow">LIVE PERFORMANCE</text>
    <text x="130" y="266" class="title">Pulse</text>
    <text x="130" y="318" class="small">FUEL FOR THE NEXT MOVE</text>
  </g>

  <g class="reveal d2">
    <rect x="130" y="390" width="420" height="220" rx="28" fill="url(#card-pulse)" stroke="rgba(255,255,255,0.08)"/>
    <text x="170" y="463" class="label">IMPACT</text>
    <text x="170" y="538" class="metric">54%</text>
    <text x="170" y="574" class="small">average uplift</text>

    <rect x="600" y="390" width="420" height="220" rx="28" fill="url(#card-pulse)" stroke="rgba(255,255,255,0.08)"/>
    <text x="640" y="463" class="label">SCALE</text>
    <text x="640" y="538" class="metric">1.9x</text>
    <text x="640" y="574" class="small">faster delivery</text>

    <rect x="1070" y="390" width="420" height="220" rx="28" fill="url(#card-pulse)" stroke="rgba(255,255,255,0.08)"/>
    <text x="1110" y="463" class="label">WINDOW</text>
    <text x="1110" y="538" class="metric">11.3k</text>
    <text x="1110" y="574" class="small">execution cycle</text>
  </g>

  <g class="reveal d3 float">
    <rect x="130" y="680" width="900" height="220" rx="30" fill="rgba(18,24,36,0.42)" stroke="rgba(255,255,255,0.08)"/>
    <text x="170" y="742" class="label">NARRATIVE</text>
    <text x="170" y="796" class="body">1. Identify the sharpest opportunity.</text>
    <text x="170" y="834" class="body">2. Align the system, product, and creative story.</text>
    <text x="170" y="872" class="body">3. Turn momentum into a measurable action plan.</text>

    <rect x="1100" y="680" width="590" height="220" rx="30" fill="rgba(18,24,36,0.42)" stroke="rgba(255,255,255,0.08)"/>
    <path d="M1160 815C1235 790 1280 730 1360 760C1442 790 1475 700 1560 670C1645 640 1700 730 1720 780" fill="none" stroke="#ff8a5c" stroke-width="8" stroke-linecap="round"/>
    <path d="M1160 815H1720" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <circle cx="1235" cy="790" r="8" fill="#ff4573"/>
    <circle cx="1360" cy="760" r="10" fill="#fbde77"/>
    <circle cx="1560" cy="670" r="10" fill="#ff8a5c"/>
    <circle cx="1705" cy="780" r="12" fill="#ff4573"/>
  </g>
</svg>
