<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Launch — product feature content slide template</title>
  <desc id="desc">A high-energy dark product presentation slide with three feature cards and an animated product interface preview.</desc>
  <defs>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ddff70"/><stop offset="1" stop-color="#99ec5b"/>
    </linearGradient>
    <radialGradient id="flare">
      <stop stop-color="#b8ff61" stop-opacity=".22"/><stop offset="1" stop-color="#b8ff61" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#c5ed91" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
      .label { fill: #c3cca9; font-size: 16px; font-weight: 680; letter-spacing: 4px; }
      .heading { fill: #f7f8f2; font-size: 68px; font-weight: 770; letter-spacing: -4px; }
      .copy { fill: #c3cca9; font-size: 20px; }
      .card-title { fill: #f5f8ed; font-size: 19px; font-weight: 700; }
      .card-copy { fill: #c3cca9; font-size: 15px; }
      .reveal { opacity: 0; transform: translateY(16px); animation: reveal .85s cubic-bezier(.2,.7,.2,1) forwards; }
      .d1 { animation-delay: .14s; }.d2 { animation-delay: .28s; }.d3 { animation-delay: .42s; }
      .panel { animation: float 5.5s ease-in-out infinite; transform-origin: 1435px 563px; }
      .progress { animation: load 3s ease-in-out infinite alternate; }
      @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
      @keyframes float { 50% { transform: translateY(-9px); } }
      @keyframes load { to { transform: scaleX(.74); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
        .reveal { opacity: 1; transform: none; }
      }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#10130e"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <ellipse cx="1455" cy="530" rx="470" ry="450" fill="url(#flare)"/>
  <text class="label reveal" x="144" y="116">03  /  BUILT TO MAKE A DIFFERENCE</text>
  <text class="heading reveal d1" x="138" y="234">Three ways forward.</text>
  <text class="copy reveal d2" x="146" y="291">Show the benefits. Make the value tangible.</text>
  <g class="reveal d2">
    <rect x="144" y="354" width="522" height="148" rx="18" fill="#1b2117" stroke="#c6f46d" stroke-opacity=".32"/>
    <circle cx="194" cy="407" r="22" fill="#d4fc7b" fill-opacity=".16" stroke="#d4fc7b" stroke-opacity=".8"/>
    <path d="m184 407 7 7 14-16" fill="none" stroke="#d4fc7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="235" y="402">Less busywork</text>
    <text class="card-copy" x="235" y="434">Automate the routine. Give your team time</text>
    <text class="card-copy" x="235" y="459">back for the work that matters.</text>
    <rect x="144" y="526" width="522" height="148" rx="18" fill="#1b2117" stroke="#c6f46d" stroke-opacity=".32"/>
    <circle cx="194" cy="579" r="22" fill="#d4fc7b" fill-opacity=".16" stroke="#d4fc7b" stroke-opacity=".8"/>
    <path d="M183 579h22m-8-8 8 8-8 8" fill="none" stroke="#d4fc7b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="card-title" x="235" y="574">Faster decisions</text>
    <text class="card-copy" x="235" y="606">See the signal sooner and move with</text>
    <text class="card-copy" x="235" y="631">confidence while it still matters.</text>
    <rect x="144" y="698" width="522" height="148" rx="18" fill="#1b2117" stroke="#c6f46d" stroke-opacity=".32"/>
    <circle cx="194" cy="751" r="22" fill="#d4fc7b" fill-opacity=".16" stroke="#d4fc7b" stroke-opacity=".8"/>
    <path d="M194 738v26m-13-13h26m-22-9 18 18m0-18-18 18" fill="none" stroke="#d4fc7b" stroke-width="2"/>
    <text class="card-title" x="235" y="746">Room to grow</text>
    <text class="card-copy" x="235" y="778">A flexible foundation for what's next,</text>
    <text class="card-copy" x="235" y="803">without adding more complexity.</text>
  </g>
  <g class="panel">
    <rect x="828" y="354" width="810" height="492" rx="22" fill="#20271c" stroke="#d2fb7a" stroke-opacity=".65" stroke-width="2"/>
    <rect x="849" y="375" width="768" height="450" rx="12" fill="#171c14"/>
    <circle cx="879" cy="402" r="5" fill="#ddff70"/><circle cx="899" cy="402" r="5" fill="#ddff70" opacity=".48"/>
    <circle cx="919" cy="402" r="5" fill="#ddff70" opacity=".25"/>
    <text x="884" y="456" fill="#c6d2ae" font-size="14" font-weight="650" letter-spacing="3">YOUR PRODUCT  /  OVERVIEW</text>
    <text x="884" y="512" fill="#f5f8ed" font-size="36" font-weight="740" letter-spacing="-2">Everything in sync.</text>
    <text x="884" y="550" fill="#a8b19a" font-size="17">A clear view of the work moving forward.</text>
    <rect x="884" y="586" width="706" height="1" fill="#eaffd0" opacity=".15"/>
    <rect x="884" y="613" width="205" height="153" rx="12" fill="#232c1e" stroke="#d4fc7b" stroke-opacity=".24"/>
    <text x="907" y="647" fill="#c3cca9" font-size="13" letter-spacing="2">PROJECTS</text>
    <text x="907" y="708" fill="#f5f8ed" font-size="42" font-weight="740">24</text>
    <rect x="907" y="733" width="147" height="7" rx="3" fill="#69725a"/>
    <rect class="progress" x="907" y="733" width="108" height="7" rx="3" fill="url(#lime)" transform-box="fill-box" transform-origin="left"/>
    <rect x="1107" y="613" width="205" height="153" rx="12" fill="#232c1e" stroke="#d4fc7b" stroke-opacity=".24"/>
    <text x="1130" y="647" fill="#c3cca9" font-size="13" letter-spacing="2">COMPLETED</text>
    <text x="1130" y="708" fill="#f5f8ed" font-size="42" font-weight="740">86%</text>
    <path d="M1132 743h151" stroke="#58624d" stroke-width="6" stroke-linecap="round"/>
    <path d="M1132 743h127" stroke="url(#lime)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
    <rect x="1330" y="613" width="260" height="153" rx="12" fill="#232c1e" stroke="#d4fc7b" stroke-opacity=".24"/>
    <text x="1353" y="647" fill="#c3cca9" font-size="13" letter-spacing="2">LATEST UPDATE</text>
    <circle cx="1363" cy="699" r="10" fill="#d4fc7b" fill-opacity=".25" stroke="#d4fc7b"/>
    <text x="1384" y="695" fill="#f5f8ed" font-size="15" font-weight="650">Launch plan</text>
    <text x="1384" y="720" fill="#a8b19a" font-size="13">Ready for review</text>
    <text x="1384" y="743" fill="#c3cca9" font-size="12">Just now</text>
  </g>
  <path d="M144 923H1776" stroke="#efffd2" stroke-opacity=".16"/>
  <text class="label" x="144" y="976" font-size="13" letter-spacing="3">YOUR BRAND</text>
  <text x="1776" y="976" text-anchor="end" fill="#c3cca9" font-size="14" letter-spacing="3">03  /  08</text>
  <rect x="36" y="36" width="1848" height="1008" rx="22" fill="none" stroke="#e3ffbd" stroke-opacity=".14" stroke-width="2"/>
</svg>
